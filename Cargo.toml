[workspace]
resolver = "2"
members = ["proto", "crates/keymap", "crates/layout", "crates/net", "crates/itest", "server", "agent"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
flow-proto = { path = "proto" }
flow-keymap = { path = "crates/keymap" }
flow-layout = { path = "crates/layout" }
flow-net = { path = "crates/net" }
flow-server = { path = "server" }
flow-agent = { path = "agent" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
sha2 = "0.10"
rand = "0.8"
data-encoding = "2"
subtle = "2"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
bytes = "1"
mdns-sd = "0.21"
axum = "0.8"
hostname = "0.4"
directories = "6"
png = "0.17"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
