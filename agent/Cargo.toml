[package]
name = "flow-agent"
description = "FlowCursor agent: captures and injects mouse/keyboard, syncs clipboard"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "flow-agent"
path = "src/main.rs"

[features]
default = []

[dependencies]
flow-proto.workspace = true
flow-keymap.workspace = true
flow-layout.workspace = true
flow-net.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { workspace = true, features = ["env"] }
toml.workspace = true
rand.workspace = true
hostname.workspace = true
directories.workspace = true
png.workspace = true
